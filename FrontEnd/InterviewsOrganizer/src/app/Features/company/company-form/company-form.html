<mat-card class="company-card">
    <div class="actions">
        <button matButton="outlined" type="button" (click)="cancel()">Cancel</button>
        <button matButton="filled" type="button" (click)="saveChanges()">Save changes</button>
    </div>


    <header class="card-header">
        <span class="brand-badge">
            <mat-icon svgIcon="sp-company" />
        </span>
        <div class="card-heading">
            <h2 class="card-title">{{ isCreating() ? 'New company' : 'Company details' }}</h2>
            <p class="card-subtitle">Manage company details, positions, and interview history.</p>
        </div>
    </header>

    <form class="company-form" [formGroup]="form" (ngSubmit)="saveChanges()" novalidate>
        <mat-form-field appearance="outline">
            <mat-label>Company name</mat-label>
            <input matInput type="text" formControlName="name" autocomplete="organization" />
            @if (form.controls.name.hasError('required')) {
            <mat-error>Company name is required</mat-error>
            }
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>Company info</mat-label>
            <textarea matInput rows="4" formControlName="companyInfo" placeholder="Enter company info"></textarea>
            <mat-hint>What do they do? Anything worth remembering.</mat-hint>
        </mat-form-field>

        <mat-form-field appearance="outline">
            <mat-label>URL</mat-label>
            <input matInput type="url" formControlName="logoUrl" />
        </mat-form-field>
        
    </form>

    <app-position-area [companyId]="company()?.id ?? ''" (saved)="onPositionSaved($event)" />
</mat-card>
