<div class="login-area">
    <button matButton="filled" (click)="login()">Login</button>
    @if(!loggedIn()){
        <button class="get-started"
         matButton="filled"
          (click)="signUp()">Get started</button>
    }
    @else{
        <button matButton="filled" (click)="logout()">Logout</button>
    }
   
</div>
